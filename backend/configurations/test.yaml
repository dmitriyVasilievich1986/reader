environment: prod

info:
    name: "Reader"
    description: "The application for reading books"
    api_info:
        app_port: 8000
        debug: false
        log_level: INFO
        api_prefix: /reader
    cors_info:
        origins:
            - "*"
        allow_credentials: true
        allow_methods:
            - GET
            - POST
            - PUT
            - PATCH
            - OPTIONS
            - DELETE
        allow_headers:
            - "*"
    paths_info:
        alembic_ini: src/reader/services/alembic/alembic.ini
        static: static
        assets: static/assets
        images: static/images
        index_html: static/index.html


services:
    database:
        provider: "sqlite+aiosqlite"
        host: reader.test.sqlite3
