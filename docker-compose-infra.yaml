services:
  nginx:
    image: nginx:latest
    container_name: reader-infra-nginx
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./nginx/config/nginx-infra.conf:/etc/nginx/nginx.conf:ro
      - ./backend/static:/usr/share/nginx/html/static:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - reader-infra-network
    restart: unless-stopped

  db:
    image: postgres:18
    container_name: reader-infra-db
    env_file:
      - path: ./backend/db.env
        required: true
    ports:
      - 5432:5432
    volumes:
      - ./db/data:/var/lib/postgresql
    networks:
      - reader-infra-network
    restart: unless-stopped

networks:
  reader-infra-network:
    external: false
