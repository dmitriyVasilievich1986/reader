events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json image/svg+xml;

    server {
        listen 80;
        listen [::]:80;
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name reader;

        ssl_certificate /etc/nginx/ssl/reader.pem;
        ssl_certificate_key /etc/nginx/ssl/reader.key;

        # Recommended security settings
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        root /usr/share/nginx/html/static;
        index index.html;

        # SPA entry point — serve index.html for any unmatched route
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Hashed JS/CSS bundles produced by the frontend build
        location /assets/ {
            alias /usr/share/nginx/html/static/assets/;
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # Legacy/plain JS bundle output
        location /js/ {
            alias /usr/share/nginx/html/static/js/;
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # Book / cover images
        location /static/images/ {
            alias /usr/share/nginx/html/static/images/;
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # Infra-only deployment: no backend container, backend routes are not served
        location /api/ {
            return 404;
        }

        location = /health {
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }
    }
}
