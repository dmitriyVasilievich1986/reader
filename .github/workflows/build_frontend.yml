name: build-frontend

on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - main
      - development

jobs:
  build-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Detect frontend changes
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - '.github/workflows/build_frontend.yml'

      - name: Skip frontend build (no relevant changes)
        if: steps.changes.outputs.frontend != 'true'
        run: echo "No frontend or workflow changes; marking check successful."

      # Installs Vite+ (version from package.json), Node.js and runs `vp install`
      - name: Setup Vite+
        if: steps.changes.outputs.frontend == 'true'
        uses: voidzero-dev/setup-vp@v1.21.2
        with:
          working-directory: ./frontend
          node-version: "24"
          cache: true
          cache-dependency-path: frontend/package-lock.json

      - name: Run oxfmt formatter check
        if: steps.changes.outputs.frontend == 'true'
        working-directory: ./frontend
        run: vp fmt --check .

      # Type-aware lint: also reports TypeScript type errors (`typeCheck` in vite.config.ts)
      - name: Run oxlint linter and type check
        if: steps.changes.outputs.frontend == 'true'
        working-directory: ./frontend
        run: vp lint .

      - name: Build project
        if: steps.changes.outputs.frontend == 'true'
        working-directory: ./frontend
        run: vp run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: steps.changes.outputs.frontend == 'true'
        with:
          name: frontend-build
          path: frontend/dist/
          retention-days: 30
